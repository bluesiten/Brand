<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브랜드의 모든 것 — 패션 브랜드 아카이브</title>
<meta name="description" content="국내외 패션 브랜드의 역사와 정보를 한곳에서. 럭셔리부터 스트리트, 사라진 브랜드까지 검색하고 살펴보는 패션 브랜드 아카이브.">
<meta property="og:title" content="브랜드의 모든 것 — 패션 브랜드 아카이브">
<meta property="og:description" content="국내외 패션 브랜드의 역사와 정보를 한곳에서.">
<meta name="theme-color" content="#f4f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#f4f1ea; --paper-2:#ebe6db; --ink:#151413; --ink-2:#4a4640; --ink-3:#8a847a;
    --line:#d8d1c3; --accent:#8c2f1f; --white:#fffdf8;
    --serif:"Noto Serif KR","Cormorant Garamond",serif; --latin:"Cormorant Garamond","Noto Serif KR",serif;
    --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  img{display:block;max-width:100%}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* masthead */
  .mast{border-bottom:1px solid var(--ink);padding:18px 0 14px}
  .mast .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  .logo{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4.4vw,44px);letter-spacing:-.02em;line-height:1;margin:0;cursor:pointer}
  .logo small{display:block;font-family:var(--latin);font-weight:500;font-style:italic;font-size:.42em;letter-spacing:.02em;color:var(--ink-2);margin-top:6px}
  .mast-meta{font-size:12px;color:var(--ink-3);text-align:right;line-height:1.5;white-space:nowrap}
  .mast-meta b{color:var(--ink);font-weight:600}

  /* hero */
  .hero{padding:28px 0 36px;border-bottom:1px solid var(--line)}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hero-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center;margin-top:14px}
  .hero-media{position:relative;aspect-ratio:4/5;background:var(--paper-2);overflow:hidden}
  .hero-media img{width:100%;height:100%;object-fit:cover;filter:saturate(.92)}
  .hero-media.logo-mode{display:flex;align-items:center;justify-content:center;background:var(--white)}
  .hero-media.logo-mode img{width:62%;height:auto;max-height:62%;object-fit:contain;filter:none}
  .hero-media .typo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:clamp(60px,12vw,160px);font-weight:600;color:var(--ink);background:var(--paper-2);padding:20px;text-align:center;line-height:.95;word-break:break-word}
  .hero h2{font-family:var(--serif);font-weight:900;font-size:clamp(38px,6.2vw,76px);line-height:1.02;letter-spacing:-.03em;margin:10px 0 6px;word-break:keep-all}
  .hero .en{font-family:var(--latin);font-style:italic;font-size:clamp(18px,2.2vw,24px);color:var(--ink-2)}
  .hero .meta{margin:18px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
  .hero .meta b{color:var(--ink);font-weight:600}
  .hero p.desc{font-size:15px;color:var(--ink-2);margin:0 0 22px;max-width:46ch}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:.01em;transition:background .15s,color .15s}
  .btn:hover{background:var(--accent);border-color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .hero-next{margin-top:14px;font-size:12px;color:var(--ink-3)}

  /* toolbar */
  .tools{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .tools .wrap{padding-top:14px;padding-bottom:12px}
  .search{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding:4px 0 8px}
  .search svg{flex:none}
  .search input{flex:1;border:0;background:transparent;font-family:var(--serif);font-size:clamp(18px,2.4vw,24px);font-weight:700;color:var(--ink);outline:none;min-width:0;padding:4px 0}
  .search input::placeholder{color:var(--ink-3);font-weight:500}
  .clear{border:0;background:none;color:var(--ink-3);font-size:13px;padding:4px 6px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--white);padding:7px 13px;font-size:13px;border-radius:999px;white-space:nowrap;transition:all .15s}
  .chip:hover{border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip .n{opacity:.55;margin-left:4px;font-size:11px}
  .row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:10px}
  .seg{display:inline-flex;border:1px solid var(--line);background:var(--white)}
  .seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--ink-2)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--white);padding:6px 10px;color:var(--ink);border-radius:0}
  .count{margin-left:auto;font-size:13px;color:var(--ink-3)}
  .count b{color:var(--ink)}

  /* grid */
  .list{padding:26px 0 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px}
  .card{display:block;text-decoration:none;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
  .thumb{aspect-ratio:1/1;background:var(--paper-2);overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .thumb.logo-mode{background:var(--white)}
  .thumb.logo-mode img{object-fit:contain;padding:18%}
  .card:hover .thumb img{transform:scale(1.04)}
  .thumb .typo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-family:var(--latin);font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1;color:var(--ink);word-break:break-word}
  .thumb .gone{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 7px}
  .card h3{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.3;margin:12px 0 2px;letter-spacing:-.01em;word-break:keep-all}
  .card .sub{font-family:var(--latin);font-style:italic;font-size:15px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tag{font-size:12px;color:var(--ink-3);margin-top:4px}
  .more{display:block;margin:36px auto 0;padding:13px 30px;border:1px solid var(--ink);background:transparent;font-size:14px;font-weight:600}
  .more:hover{background:var(--ink);color:var(--paper)}
  .empty{padding:60px 0;text-align:center;color:var(--ink-3)}
  .empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px}

  /* detail */
  .detail{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
  .detail.open{opacity:1;transform:none;pointer-events:auto}
  .dbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(244,241,234,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .dbar button{border:0;background:none;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
  .dbar .share{font-weight:500;color:var(--ink-2);font-size:13px}
  .dhead{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;padding:30px 0 34px;border-bottom:1px solid var(--ink)}
  .dhead .hero-media{aspect-ratio:1/1}
  .dhead h1{font-family:var(--serif);font-weight:900;font-size:clamp(36px,6vw,68px);line-height:1.03;letter-spacing:-.03em;margin:10px 0 6px;word-break:keep-all}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .badge{font-size:12px;border:1px solid var(--line);background:var(--white);padding:4px 10px}
  .badge.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .badge.red{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sec{padding:34px 0;border-bottom:1px solid var(--line)}
  .sec h2{font-family:var(--serif);font-size:24px;font-weight:900;margin:0 0 4px;letter-spacing:-.02em}
  .sec .lead{font-size:13px;color:var(--ink-3);margin:0 0 20px}
  .timeline{list-style:none;margin:0;padding:0;border-left:1px solid var(--ink);max-width:720px}
  .timeline li{position:relative;padding:0 0 22px 26px}
  .timeline li::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;background:var(--paper);border:1px solid var(--ink);border-radius:50%}
  .timeline li.end::before{background:var(--accent);border-color:var(--accent)}
  .timeline .yr{font-family:var(--latin);font-size:26px;font-weight:600;line-height:1}
  .timeline .what{font-size:14px;color:var(--ink-2);margin-top:4px}
  .wiki{max-width:720px;font-size:15.5px;line-height:1.85;color:var(--ink);margin-top:10px}
  .wiki .src{display:block;margin-top:10px;font-size:12px;color:var(--ink-3)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:1px solid var(--line);max-width:900px;margin-top:22px}
  .facts div{padding:12px 0;border-bottom:1px solid var(--line);padding-right:16px}
  .facts dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .facts dd{margin:3px 0 0;font-size:14px}
  .shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .shop a{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--ink);background:var(--white);text-decoration:none;min-height:120px;transition:background .15s,color .15s}
  .shop a:hover{background:var(--ink);color:var(--paper)}
  .shop a:hover small{color:var(--line)}
  .shop b{font-family:var(--serif);font-size:18px}
  .shop small{font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .shop .arrow{margin-top:auto;font-size:13px;font-weight:600}
  .subs{display:flex;flex-wrap:wrap;gap:6px}
  .dfoot{padding:24px 0 60px;font-size:12px;color:var(--ink-3)}
  .dfoot a{color:var(--ink-2)}

  .looks{display:flex;gap:8px;margin-top:22px}
  .looks button{flex:0 0 auto;width:74px;aspect-ratio:3/4;border:0;padding:0;background:var(--paper-2);overflow:hidden}
  .looks img{width:100%;height:100%;object-fit:cover}
  .credit{position:absolute;right:0;bottom:0;max-width:100%;background:rgba(21,20,19,.62);color:#f4f1ea;font-size:10.5px;padding:4px 8px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .credit a{color:inherit}
  .gallery{columns:3 260px;column-gap:14px}
  .gallery figure{break-inside:avoid;margin:0 0 14px;cursor:zoom-in}
  .gallery img{width:100%;height:auto;background:var(--paper-2)}
  .gallery figcaption{font-size:11.5px;color:var(--ink-3);padding-top:6px;line-height:1.45}
  .gallery figcaption b{color:var(--ink-2);font-weight:600}
  .gallery .kind{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-right:6px}
  .histphoto{margin:26px 0 0;max-width:720px}
  .histphoto img{width:100%;max-height:440px;object-fit:cover;filter:grayscale(.25) sepia(.08)}
  .histphoto figcaption{font-size:11.5px;color:var(--ink-3);margin-top:6px}
  .wiki p{margin:0 0 14px}
  .lb{position:fixed;inset:0;z-index:80;background:rgba(15,14,13,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:82vh;object-fit:contain}
  .lb p{color:#d8d1c3;font-size:12px;margin:12px 0 0;text-align:center;max-width:720px}
  .lb p a{color:#fff}
  .lb button{position:absolute;top:14px;right:18px;border:0;background:none;color:#fff;font-size:30px;line-height:1}
  footer{border-top:1px solid var(--ink);padding:28px 0 50px;font-size:12px;color:var(--ink-3);line-height:1.8}
  footer b{color:var(--ink);font-family:var(--serif);font-size:15px}
  .loading{padding:80px 0;text-align:center;font-family:var(--serif);color:var(--ink-3)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:820px){
    .hero-grid,.dhead{grid-template-columns:1fr;gap:20px}
    .hero-media{aspect-ratio:4/3}
    .dhead .hero-media{aspect-ratio:4/3}
    .mast-meta{display:none}
    .grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}
    .card h3{font-size:15px}
    .card .sub{font-size:14px}
    .count{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <h1 class="logo" onclick="goHome()">브랜드의 모든 것<small>The Fashion Brand Archive</small></h1>
    <div class="mast-meta" id="mastMeta"></div>
  </div>
</header>

<main id="home">
  <section class="hero" aria-label="오늘의 브랜드">
    <div class="wrap" id="hero"><div class="loading">브랜드 아카이브를 펼치는 중…</div></div>
  </section>

  <div class="tools">
    <div class="wrap">
      <label class="search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">브랜드 검색</span>
        <input id="q" type="search" placeholder="브랜드, 창립자, 모회사 검색" autocomplete="off">
        <button class="clear" id="clear" hidden>지우기</button>
      </label>
      <div class="chips" id="cats" role="toolbar" aria-label="카테고리"></div>
      <div class="row2">
        <div class="seg" id="origin" role="group" aria-label="국내/해외">
          <button data-v="all" aria-pressed="true">전체</button><button data-v="kr" aria-pressed="false">국내</button><button data-v="gl" aria-pressed="false">해외</button>
        </div>
        <div class="seg" id="status" role="group" aria-label="상태">
          <button data-v="all" aria-pressed="true">전체</button><button data-v="on" aria-pressed="false">활동중</button><button data-v="gone" aria-pressed="false">사라진 브랜드</button>
        </div>
        <select id="sort" aria-label="정렬">
          <option value="fame">인지도순</option>
          <option value="name">이름순</option>
          <option value="old">오래된 순</option>
          <option value="new">최근 설립 순</option>
        </select>
        <div class="count" id="count"></div>
      </div>
    </div>
  </div>

  <section class="list">
    <div class="wrap">
      <div class="grid" id="grid"></div>
      <div id="emptyBox"></div>
      <button class="more" id="more" hidden>더 보기</button>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <b>브랜드의 모든 것</b><br>
      브랜드 정보: Wikidata(CC0) · 위키백과(CC BY-SA) · 각 브랜드 공식 사이트<br>
      이미지: Wikimedia Commons 자유 라이선스 파일(촬영자 표기) · 각 브랜드 공식 사이트 대표 이미지(원본 링크 표시)<br>
      상표·로고·공식 이미지의 권리는 각 브랜드에 있으며, 요청 시 즉시 내립니다.<br>
      <span id="updated"></span>
    </div>
  </footer>
</main>

<article class="detail" id="detail" aria-hidden="true">
  <div class="dbar">
    <button onclick="closeDetail()" aria-label="목록으로">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>목록으로
    </button>
    <button class="share" onclick="share()">링크 복사</button>
  </div>
  <div class="wrap" id="dbody"></div>
</article>

<div class="lb" id="lb" onclick="if(event.target===this)closeLb()"><button onclick="closeLb()" aria-label="닫기">×</button><img id="lbImg" alt=""><p id="lbCap"></p></div>

<script>
const CATS = ["럭셔리","컨템포러리·디자이너","캐주얼","SPA·패스트패션","스트리트","스포츠","아웃도어","클래식·테일러링","데님·워크웨어","신발","잡화·주얼리","언더웨어·스윔","키즈","미분류"];
const PAGE = 48;
let ALL = [], VIEW = [], shown = 0, today = null;
const st = { q:"", cat:"전체", origin:"all", status:"all", sort:"fame" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").normalize("NFC").replace(/[^0-9a-z가-힣]+/g,"");
const img = (u, w) => u ? u.replace(/^http:/, "https:") + (u.includes("?") ? "&" : "?") + "width=" + w : "";
const keyOf = b => b.i || "n-" + encodeURIComponent(b.n);
const naverUrl = b => "https://search.shopping.naver.com/search/all?sort=date&query=" + encodeURIComponent(b.k ? b.n : (b.e || b.n));
const googleShop = b => "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(b.e || b.n);
const years = b => b.f ? (b.s ? `${b.f}–${b.x || "?"}` : `Since ${b.f}`) : (b.s ? `~${b.x || "?"}` : "");

// 대표 비주얼: 런웨이 사진 → 공식 사이트 대표 이미지 → 제품 사진 → 로고 → 글자 표지 (건물 사진은 히스토리에서만)
function cover(b) {
  const g = b.g || [];
  const r = g.find(x => x.k === "r");
  if (r) return { u: r.u, ph: r };
  if (b.og) return { u: b.og, off: true };
  if (g[0]) return { u: g[0].u, ph: g[0] };
  if (b.lo) return { u: img(b.lo, 600), logo: true };
  return null;
}
function credit(c, b) {
  if (c && c.ph) return `<span class="credit">사진 ${esc(c.ph.a)} · <a href="${esc(c.ph.w)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(c.ph.l)}</a></span>`;
  if (c && c.off && b.w) return `<span class="credit">이미지 · <a href="${esc(b.w)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(b.e || b.n)} 공식 사이트</a></span>`;
  return "";
}
// 갤러리용: 공식 이미지 + 자유 라이선스 사진
function photos(b) {
  const list = (b.g || []).slice();
  if (b.og) list.splice(list.some(x => x.k === "r") ? 1 : 0, 0, { u: b.og, k: "o", t: `${b.e || b.n} 공식 사이트 대표 이미지`, a: `${b.e || b.n}`, l: "공식 사이트", w: b.w });
  return list;
}
function media(b, w, cls, withCredit) {
  const typo = `<div class="typo">${esc(b.e || b.n)}</div>`;
  const c = cover(b);
  if (!c) return `<div class="${cls}">${typo}</div>`;
  return `<div class="${cls}${c.logo ? " logo-mode" : ""}">${typo}<img loading="lazy" alt="${esc(b.n)}" src="${esc(c.u)}"${c.off ? ' referrerpolicy="no-referrer"' : ""} onload="this.previousElementSibling.remove()" onerror="this.nextElementSibling&&this.nextElementSibling.remove();this.remove()">${withCredit ? credit(c, b) : ""}</div>`;
}
let LB = [];
function openLb(i) {
  const ph = LB[i]; if (!ph) return;
  $("#lbImg").referrerPolicy = ph.k === "o" ? "no-referrer" : "";
  $("#lbImg").src = ph.u;
  $("#lbCap").innerHTML = ph.k === "o"
    ? `${esc(ph.t)}<br>이미지 권리: ${esc(ph.a)} · <a href="${esc(ph.w)}" target="_blank" rel="noopener">공식 사이트 바로 가기</a>`
    : `${esc(ph.t)}<br>사진 ${esc(ph.a)} · ${esc(ph.l)} · <a href="${esc(ph.w)}" target="_blank" rel="noopener">Wikimedia Commons 원본</a>`;
  $("#lb").classList.add("open");
}
function closeLb() { $("#lb").classList.remove("open"); }

/* ---------- 오늘의 브랜드: 날짜마다 바뀌는 고정 선택 ---------- */
function kstDate(offset = 0) {
  const d = new Date(Date.now() + 9 * 3600e3 + offset * 864e5);
  return d.toISOString().slice(0, 10);
}
function pickToday(dateStr) {
  let pool = ALL.filter(b => ((b.g || []).some(x => x.k === "r") || b.og) && (b.r || 0) >= 3 && b.d);
  if (pool.length < 20) pool = ALL.filter(b => (b.g || []).length || b.og);
  if (pool.length < 20) pool = ALL.filter(b => (b.r || 0) >= 6 && b.d);
  let h = 2166136261;
  for (const ch of dateStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return pool[Math.abs(h) % pool.length];
}
function renderHero() {
  const ds = kstDate();
  today = pickToday(ds);
  const b = today;
  const meta = [
    b.c && b.c !== "미분류" ? `<span><b>${esc(b.c)}</b></span>` : "",
    b.co ? `<span>${esc(b.co)}</span>` : "",
    b.f ? `<span>설립 <b>${b.f}</b></span>` : "",
    b.s ? `<span>사라짐 <b>${b.x || "?"}</b></span>` : "",
    b.fd ? `<span>창립 ${esc(b.fd)}</span>` : "",
  ].join("");
  $("#hero").innerHTML = `
    <div class="kicker">Today's Brand · ${ds.replace(/-/g, ".")}</div>
    <div class="hero-grid">
      ${media(b, 1200, "hero-media", true)}
      <div>
        <div class="kicker" style="color:var(--ink-3)">오늘의 브랜드</div>
        <h2>${esc(b.n)}</h2>
        ${b.e && b.e !== b.n ? `<div class="en">${esc(b.e)}</div>` : ""}
        <div class="meta">${meta}</div>
        ${b.d ? `<p class="desc">${esc(b.d)}</p>` : ""}
        <div class="btns">
          <button class="btn" onclick="openDetail('${esc(keyOf(b))}')">정보 보기 →</button>
          ${b.w ? `<a class="btn ghost" href="${esc(b.w)}" target="_blank" rel="noopener">공식 사이트</a>` : ""}
        </div>
        ${photos(b).length > 1 ? `<div class="looks">${photos(b).slice(1, 5).map((x, i) => `<button onclick="LB=photos(today);openLb(${i + 1})" aria-label="사진 크게 보기"><img loading="lazy" src="${esc(x.u)}"${x.k === "o" ? ' referrerpolicy="no-referrer"' : ""} alt="" onerror="this.parentNode.remove()"></button>`).join("")}</div>` : ""}
        <div class="hero-next">매일 자정, 아카이브에서 새로운 브랜드를 꺼내 소개합니다.</div>
      </div>
    </div>`;
}

/* ---------- 필터·검색 ---------- */
function renderCats() {
  const counts = {};
  ALL.forEach(b => counts[b.c] = (counts[b.c] || 0) + 1);
  const items = [["전체", ALL.length], ...CATS.filter(c => counts[c]).map(c => [c, counts[c]])];
  $("#cats").innerHTML = items.map(([c, n]) =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${st.cat === c}">${esc(c)}<span class="n">${n.toLocaleString()}</span></button>`).join("");
}
function apply() {
  const q = norm(st.q);
  VIEW = ALL.filter(b =>
    (st.cat === "전체" || b.c === st.cat) &&
    (st.origin === "all" || (st.origin === "kr" ? b.k : !b.k)) &&
    (st.status === "all" || (st.status === "gone" ? b.s : !b.s)) &&
    (!q || b._s.includes(q)));
  const by = {
    fame: (a, b) => (b.r || 0) - (a.r || 0) || a.n.localeCompare(b.n, "ko"),
    name: (a, b) => a.n.localeCompare(b.n, "ko"),
    old: (a, b) => (a.f || 9999) - (b.f || 9999),
    new: (a, b) => (b.f || 0) - (a.f || 0),
  }[st.sort];
  if (q) {  // 검색어와 이름이 정확히/앞부분 일치하면 위로
    VIEW.sort((a, b) => rank(b, q) - rank(a, q) || by(a, b));
  } else VIEW.sort(by);
  shown = 0;
  $("#grid").innerHTML = "";
  $("#count").innerHTML = `<b>${VIEW.length.toLocaleString()}</b>개 브랜드`;
  $("#emptyBox").innerHTML = VIEW.length ? "" :
    `<div class="empty"><b>찾는 브랜드가 없어요</b>철자를 바꾸거나 영문명으로 검색해 보세요.</div>`;
  more();
}
function rank(b, q) {
  const n1 = norm(b.n), n2 = norm(b.e);
  if (n1 === q || n2 === q) return 3;
  if (n1.startsWith(q) || n2.startsWith(q)) return 2;
  if (n1.includes(q) || n2.includes(q)) return 1;
  return 0;
}
function more() {
  const slice = VIEW.slice(shown, shown + PAGE);
  $("#grid").insertAdjacentHTML("beforeend", slice.map(b => `
    <button class="card" onclick="openDetail('${esc(keyOf(b))}')">
      <div style="position:relative">${media(b, 500, "thumb")}${b.s ? `<span class="gone" style="position:absolute;left:10px;top:10px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 7px">ARCHIVED</span>` : ""}</div>
      <h3>${esc(b.n)}</h3>
      ${b.e && b.e !== b.n ? `<div class="sub">${esc(b.e)}</div>` : ""}
      <div class="tag">${esc([b.c !== "미분류" ? b.c : "", years(b)].filter(Boolean).join(" · "))}</div>
    </button>`).join(""));
  shown += slice.length;
  $("#more").hidden = shown >= VIEW.length;
  $("#more").textContent = `더 보기 (${(VIEW.length - shown).toLocaleString()}개 남음)`;
}

/* ---------- 상세 ---------- */
const BY = new Map();
function openDetail(key, push = true) {
  const b = BY.get(key);
  if (!b) return;
  if (push) { try { history.pushState({ b: key }, "", "#/brand/" + key); } catch (e) {} }
  const tl = [];
  if (b.f) tl.push(`<li><div class="yr">${b.f}</div><div class="what">${esc(b.n)} 설립${b.fd ? ` — 창립자 ${esc(b.fd)}` : ""}${b.co ? ` · ${esc(b.co)}` : ""}</div></li>`);
  if (b.p) tl.push(`<li><div class="yr" style="font-size:18px">운영·소유</div><div class="what">${esc(b.p)}</div></li>`);
  if (b.s) tl.push(`<li class="end"><div class="yr">${b.x || "?"}</div><div class="what">브랜드 활동 종료 — 아카이브 브랜드</div></li>`);
  const facts = [
    ["카테고리", b.c], ["국가", b.co], ["설립", b.f], ["창립자", b.fd], ["모회사·소유", b.p],
    ["상태", b.s ? `사라짐${b.x ? ` (${b.x})` : ""}` : ""],
  ].filter(([, v]) => v);
  const shopCards = [
    b.w && [b.w, "공식 스토어", "브랜드가 직접 운영하는 사이트에서 최신 컬렉션과 신상품을 확인하세요."],
    b.ig && [b.ig, "인스타그램", "가장 빠르게 올라오는 신상품·캠페인 소식."],
    !b.s && [naverUrl(b), "네이버쇼핑 최신순", "국내 판매처의 최근 등록 상품을 최신순으로 봅니다."],
    [googleShop(b), "구글 쇼핑", "해외 판매처까지 포함한 상품 검색 결과."],
  ].filter(Boolean);
  $("#dbody").innerHTML = `
    <header class="dhead">
      ${media(b, 1000, "hero-media", true)}
      <div>
        <div class="kicker">${b.s ? "Archived Brand" : "Brand Profile"}</div>
        <h1>${esc(b.n)}</h1>
        ${b.e && b.e !== b.n ? `<div class="en" style="font-family:var(--latin);font-style:italic;font-size:22px;color:var(--ink-2)">${esc(b.e)}</div>` : ""}
        <div class="badges">
          ${b.c ? `<span class="badge dark">${esc(b.c)}</span>` : ""}
          <span class="badge">${b.k ? "국내 브랜드" : "해외 브랜드"}</span>
          ${b.s ? `<span class="badge red">사라진 브랜드</span>` : ""}
          ${years(b) ? `<span class="badge">${esc(years(b))}</span>` : ""}
        </div>
        ${b.d ? `<p style="margin-top:18px;color:var(--ink-2);max-width:48ch">${esc(b.d)}</p>` : ""}
        <div class="btns" style="margin-top:18px">
          <a class="btn" href="#shop" onclick="document.getElementById('shopSec').scrollIntoView({behavior:'smooth'});return false;">최근 상품 보기 ↓</a>
          ${b.w ? `<a class="btn ghost" href="${esc(b.w)}" target="_blank" rel="noopener">공식 사이트</a>` : ""}
        </div>
      </div>
    </header>

    ${photos(b).length ? `<section class="sec">
      <div class="kicker">Lookbook · Runway</div>
      <h2>컬렉션 & 런웨이</h2>
      <p class="lead">브랜드 공식 사이트의 대표 이미지와 자유 라이선스로 공개된 런웨이·컬렉션·제품 사진이에요. 누르면 크게 볼 수 있어요.</p>
      <div class="gallery">${photos(b).map((x, i) => `<figure onclick="LB=photos(BY.get('${esc(keyOf(b))}'));openLb(${i})"><img loading="lazy" src="${esc(x.u)}"${x.k === "o" ? ' referrerpolicy="no-referrer"' : ""} alt="${esc(x.t)}" onerror="this.parentNode.remove()"><figcaption><span class="kind">${x.k === "r" ? "RUNWAY" : x.k === "o" ? "OFFICIAL" : "PRODUCT"}</span>${esc(x.t)}<br><b>${esc(x.a)}</b> · ${esc(x.l)}</figcaption></figure>`).join("")}</div>
    </section>` : ""}

    <section class="sec">
      <div class="kicker">History</div>
      <h2>브랜드 히스토리</h2>
      <p class="lead">${b.f ? `${b.f}년 설립 이후의 이야기` : "브랜드가 걸어온 길"}</p>
      ${tl.length ? `<ol class="timeline">${tl.join("")}</ol>` : ""}
      <div class="wiki" id="wiki"></div>
      ${b.im ? `<figure class="histphoto"><img loading="lazy" src="${esc(img(b.im, 1100))}" alt="${esc(b.n)} 관련 사진" onerror="this.parentNode.remove()"><figcaption>${esc(b.n)}의 본사·매장 등 관련 사진 — Wikimedia Commons</figcaption></figure>` : ""}
      <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      ${b.w ? `<p style="margin-top:18px;font-size:13px"><a href="${esc(b.w)}" target="_blank" rel="noopener">공식 사이트에서 브랜드 스토리 더 보기 →</a></p>` : ""}
    </section>

    ${b.sl && b.sl.length ? `<section class="sec"><div class="kicker">Lines</div><h2>서브 라인</h2><p class="lead">${esc(b.n)} 아래에서 전개되는 라인</p><div class="subs">${b.sl.map(s => `<span class="badge">${esc(s)}</span>`).join("")}</div></section>` : ""}

    <section class="sec" id="shopSec">
      <div class="kicker">Shop</div>
      <h2>최근 상품 보기</h2>
      <p class="lead">${b.s ? "사라진 브랜드라 새 상품은 없지만, 빈티지·중고 상품을 찾아볼 수 있어요." : "브랜드의 최신 상품을 볼 수 있는 곳으로 연결합니다."}</p>
      <div class="shop">${shopCards.map(([u, t, d]) => `<a href="${esc(u)}" target="_blank" rel="noopener"><b>${t}</b><small>${d}</small><span class="arrow">바로 가기 →</span></a>`).join("")}</div>
    </section>

    <div class="dfoot">출처:
      ${b.i ? `<a href="https://www.wikidata.org/wiki/${esc(b.i)}" target="_blank" rel="noopener">Wikidata</a>` : ""}
      ${b.kw ? ` · <a href="${esc(b.kw)}" target="_blank" rel="noopener">한국어 위키백과</a>` : ""}
      ${b.ew ? ` · <a href="${esc(b.ew)}" target="_blank" rel="noopener">영어 위키백과</a>` : ""}
      ${b.w ? ` · <a href="${esc(b.w)}" target="_blank" rel="noopener">공식 사이트</a>` : ""}
    </div>`;
  const d = $("#detail");
  d.scrollTop = 0;
  d.classList.add("open");
  d.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  document.title = `${b.n} — 브랜드의 모든 것`;
  loadWiki(b);
}
async function loadWiki(b) {
  const box = $("#wiki");
  const src = b.kw ? ["ko", b.kw] : b.ew ? ["en", b.ew] : null;
  if (!src) return;
  box.innerHTML = `<span style="color:var(--ink-3)">위키백과에서 브랜드 역사를 불러오는 중…</span>`;
  const lang = src[0], title = decodeURIComponent(src[1].split("/wiki/")[1]);
  const done = (paras, label) => {
    if ($("#wiki") !== box) return;
    box.innerHTML = paras.map(p => `<p>${esc(p)}</p>`).join("") +
      `<span class="src">출처: ${lang === "ko" ? "한국어" : "영어"} 위키백과 「${esc(title.replace(/_/g, " "))}」${label} (CC BY-SA) · <a href="${esc(src[1])}" target="_blank" rel="noopener">전체 문서 읽기</a></span>`;
  };
  try {
    // ① 문서 본문에서 '역사/연혁/History' 섹션을 찾아 보여줌
    const u = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&format=json&formatversion=2&origin=*&titles=${encodeURIComponent(title)}`;
    const j = await (await fetch(u)).json();
    const text = j?.query?.pages?.[0]?.extract || "";
    const m = text.match(/\n==\s*(History|Company history|Brand history|역사|연혁|기업 연혁|브랜드 역사|Background|Early history|Origins)\s*==\s*\n([\s\S]*?)(?=\n==\s[^=]|$)/i);
    if (m) {
      const body = m[2].replace(/\n===?\s*(.+?)\s*===?\n/g, "\n").split(/\n+/).map(x => x.trim()).filter(x => x.length > 40);
      let out = [], n = 0;
      for (const p of body) { out.push(p); n += p.length; if (n > 1400) break; }
      if (out.length) return done(out, ` '${m[1]}' 섹션`);
    }
    // ② 없으면 문서 요약
    const intro = text.split(/\n==/)[0].split(/\n+/).map(x => x.trim()).filter(Boolean);
    if (intro.length) return done(intro.slice(0, 3), "");
    throw 0;
  } catch (e) { if ($("#wiki") === box) box.innerHTML = ""; }
}
function closeDetail(push = true) {
  const d = $("#detail");
  d.classList.remove("open");
  d.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  document.title = "브랜드의 모든 것 — 패션 브랜드 아카이브";
  if (push && location.hash) { try { history.pushState({}, "", location.pathname); } catch (e) {} }
}
function goHome() { closeDetail(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function share() {
  navigator.clipboard?.writeText(location.href).then(() => {
    const s = $(".dbar .share"); s.textContent = "복사됨 ✓"; setTimeout(() => s.textContent = "링크 복사", 1500);
  });
}
function route() {
  const m = location.hash.match(/^#\/brand\/(.+)$/);
  if (m) openDetail(m[1], false);
  else closeDetail(false);
}
window.addEventListener("popstate", route);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#detail").classList.contains("open")) closeDetail(); });

/* ---------- 이벤트 ---------- */
let t;
$("#q").addEventListener("input", e => {
  clearTimeout(t);
  $("#clear").hidden = !e.target.value;
  t = setTimeout(() => { st.q = e.target.value.trim(); apply(); }, 150);
});
$("#clear").addEventListener("click", e => { e.preventDefault(); $("#q").value = ""; st.q = ""; $("#clear").hidden = true; apply(); });
$("#cats").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  st.cat = c.dataset.c;
  document.querySelectorAll("#cats .chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  apply();
});
for (const id of ["origin", "status"]) {
  $("#" + id).addEventListener("click", e => {
    const bt = e.target.closest("button"); if (!bt) return;
    st[id] = bt.dataset.v;
    $("#" + id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === bt));
    apply();
  });
}
$("#sort").addEventListener("change", e => { st.sort = e.target.value; apply(); });
$("#more").addEventListener("click", more);

/* ---------- 시작 ---------- */
fetch("data/site.json").then(r => r.json()).then(data => {
  ALL = data.b;
  ALL.forEach(b => {
    b._s = norm([b.n, b.e, b.fd, b.p, b.co].join(" "));
    BY.set(keyOf(b), b);
  });
  const up = (data.t || "").slice(0, 10).replace(/-/g, ".");
  $("#mastMeta").innerHTML = `<b>${ALL.length.toLocaleString()}</b> brands archived<br>${up} 업데이트`;
  $("#updated").textContent = `데이터 업데이트 ${up} · 매주 월요일 자동 갱신`;
  renderHero(); renderCats(); apply(); route();
}).catch(() => { $("#hero").innerHTML = `<div class="loading">데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>`; });
</script>
