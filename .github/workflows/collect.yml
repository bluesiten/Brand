name: 브랜드 데이터 수집

on:
  workflow_dispatch:        # Actions 탭에서 'Run workflow' 버튼으로 수동 실행
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 03:17 (한국시간) 자동 갱신

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python scripts/collect_brands.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "브랜드 데이터 갱신 $(date -u +%F)"
          git push
