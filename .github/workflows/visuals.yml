name: 브랜드 비주얼(런웨이 사진) 수집
on:
  workflow_dispatch:
    inputs:
      test:
        description: "시험 개수 (비우면 전체)"
        required: false
permissions:
  contents: write
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/collect_visuals.py
        env:
          TEST: ${{ github.event.inputs.test }}
      - run: python scripts/build_site_data.py
      - if: ${{ github.event.inputs.test == '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seed/visuals.json data/site.json
          git diff --cached --quiet || git commit -m "브랜드 비주얼 갱신"
          git push
