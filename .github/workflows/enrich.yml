name: 보강 필요 브랜드 공식 사이트 찾기
on: workflow_dispatch
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python scripts/enrich_pending.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seed/official_sites.csv data/pending_not_found.txt
          git diff --cached --quiet || git commit -m "공식 사이트 확인 결과"
          git push
